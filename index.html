<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bible Connections</title>
    <meta name="description" content="An interactive exploration of 344,799 biblical cross-references: arcs, networks and statistics." />
    <meta name="theme-color" content="#08090D" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="Bible Connections" />
    <meta property="og:description" content="Discover the connections within Scripture. An interactive exploration of biblical cross-references." />
    <meta property="og:image" content="https://juanmarcosmoreno-arch.github.io/Bible_Connections/icons/social.jpg" />
    <meta property="og:url" content="https://juanmarcosmoreno-arch.github.io/Bible_Connections/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bc.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <noscript>Bible Connections requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
